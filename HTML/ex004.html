<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
</head>
<body>
    <h1>Trabalhando com Links</h1>

    <p>Para utilizar e criar links usamos a tag a (âncora) </p>

    <a href="https://www.google.com"> Clique aqui para acessar o Google </a>
    
    <p><a href="https://www.youtube.com" target="_blank"> Clique aqui para acessar o Youtube</a></p>

    <h2>Links favoritos</h2>
    <ul type="square">
    <li><a href="https://www.facebook.com" target="_blank">Facebook</a></li>
    <li><a href="https://www.youtube.com" target="_blank">Youtube</a></li>
    <li><a href="https://www.instagram.com" target="_blank">Instagram</a></li>    
    <li><a href="https://www.google.com" target="_blank">Google</a></li> 
    <li><a href="https://www.spotify.com" target="_blank">Spotify</a></li> 
    <li><a href="https://www.chatgpt.com" target="_blank">Chatgpt</a></li> 
    </ul>

    <a href="https://www.google.com" target="_blank">Clique aqui para abrir o Google</a>

</body>
</html>
