<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classe</title>

    <style>
        div{
            background-color: lightpink;
            width: 200px;
            height: 200px;
            text-align: center;
            margin:30px;
        }

        div:hover{
            background-color: green;
            font-size: 30px;
            width: 300px;
            height: 300px;
        }
        
        .azul:hover{
            background-color: blue;
        }

        .red:hover{
            background-color: red;
        }
        
    </style>

</head>
<body>
    <div>01</div>
    <div class="azul">02</div>
    <div class="red">03</div>
</body>
</html>
