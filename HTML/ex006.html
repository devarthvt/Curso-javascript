<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <h1>Trabalhando com tabelas</h1>

    <table border="1">
        <tr> <!-- - Table Row - São as linhas -->
            <th>Nome</th> <!-- Table header são as -->
            <th>Idade</th>
            <th>Estado</th>
            <th>País</th>
        </tr>

        <tr>
            <td>Arthur</td> <!-- - Table data - -->
            <td>20</td>
            <td>SP</td>
            <td>Brasil</td>
        </tr>

        <tr>
            <td>Joao</td>
            <td>17</td>
            <td>SP</td>
            <td>Brasil</td>
        </tr>
    </table>
</body>
</html>
